<article class="card">
  <a class="card__img" href="{{ include.item.url | relative_url }}">
    <img src="{{ include.item.image | relative_url }}" alt="{{ include.item.image_alt | default: include.item.title }}" loading="lazy" width="400" height="300">
  </a>
  <div class="card__body">
    <span class="card__meta">{{ include.item.category }}</span>
    <h3 class="card__title"><a href="{{ include.item.url | relative_url }}">{{ include.item.title }}</a></h3>
    <p class="card__excerpt">{{ include.item.description }}</p>
    <div class="card__footer">
      <span class="card__price">{{ include.item.price }}</span>
      <span>{% for i in (1..5) %}{% if i <= include.item.rating %}&#9733;{% else %}&#9734;{% endif %}{% endfor %}</span>
    </div>
    <a href="{{ include.item.url | relative_url }}" class="btn btn--sm" style="align-self:flex-start;">View Product</a>
  </div>
</article>
