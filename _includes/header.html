<header class="site-header">
  <div class="site-header__inner">
    <a class="logo" href="{{ '/' | relative_url }}">June<span class="dot">Trial</span></a>

    <nav class="main-nav" id="main-nav">
      <a href="{{ '/vehicles/' | relative_url }}" {% if page.section == 'vehicle' %}class="active"{% endif %}>Vehicle</a>
      <a href="{{ '/blogs/' | relative_url }}" {% if page.section == 'blog' %}class="active"{% endif %}>Blogs</a>
      <a href="{{ '/news/' | relative_url }}" {% if page.section == 'news' %}class="active"{% endif %}>News</a>
      <a href="{{ '/products/' | relative_url }}" {% if page.section == 'product' %}class="active"{% endif %}>Products</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.section == 'about' %}class="active"{% endif %}>About Us</a>
    </nav>

    <div class="header-actions">
      <button class="search-toggle" id="search-toggle" aria-label="Search" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="menu-toggle" id="menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="main-nav">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>

  <div class="search-panel" id="search-panel">
    <form role="search" onsubmit="return false;">
      <input type="text" id="site-search-input" placeholder="Search vehicles, blogs, news, products…" autocomplete="off">
    </form>
    <p class="search-hint" id="search-hint">Type at least 2 characters to search the whole site.</p>
    <div class="search-results" id="search-results"></div>
  </div>
</header>
